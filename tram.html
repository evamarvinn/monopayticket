<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f5">
  <title>Трамвай · квиток</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-kind="tram">
  <main class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">
        <img src="assets/logo.svg" alt="">
      </div>
      <button class="info-btn" id="info-btn" aria-label="Інформація">i</button>
    </header>

    <article class="ticket">
      <div class="ticket-top">
        <div class="quote">
          <p class="quote-track" id="quote"></p>
        </div>
        <div class="ticket-body">
          <p class="transport" id="transport">Трамвай</p>
          <p class="purchased" id="purchased"></p>
          <h1 class="amount" id="amount">1 квиток</h1>
          <div class="status" id="status">
            <span class="status-dot"></span>
            <span id="status-text">Квиток дійсний — </span>
            <span id="timer">60:00</span>
          </div>
          <p class="vehicle">
            <span id="transport-label">Трамвай</span>
            <strong>№</strong>
            <input class="vehicle-input" id="vehicle-input" inputmode="numeric" maxlength="4" aria-label="Номер трамвая" value="001">
          </p>
        </div>
      </div>

      <div class="perforation" aria-hidden="true">
        <span class="dash"></span>
      </div>

      <div class="ticket-bottom">
        <div class="qr-wrap">
          <img class="qr" src="assets/qr.png" alt="QR-код квитка" draggable="false">
        </div>
        <p class="number" id="number">Номер: <strong>244 197</strong></p>
      </div>
      <div class="scallop" aria-hidden="true"></div>
    </article>
  </main>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>Електронний квиток</h2>
      <p>Квиток дійсний 60 хвилин з моменту покупки. Номер транспорту можна змінити прямо на квитку або тут.</p>
      <div class="sheet-fields">
        <label>
          Номер тролейбуса
          <input id="trolley-number" inputmode="numeric" maxlength="4" autocomplete="off">
        </label>
        <label>
          Номер трамвая
          <input id="tram-number" inputmode="numeric" maxlength="4" autocomplete="off">
        </label>
        <label>
          Номер автобуса
          <input id="bus-number" inputmode="numeric" maxlength="4" autocomplete="off">
        </label>
      </div>
      <div class="sheet-actions">
        <div class="sheet-links" id="other-tickets"></div>
        <button id="close-info" type="button">Зберегти</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
